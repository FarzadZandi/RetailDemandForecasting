[project]
name = "retail-demand-forecasting"
version = "1.0.0"
description = "Category-aware monthly retail demand forecasting with StatsForecast"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "statsforecast>=2.1,<3",
    "statsmodels>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
